<h1>{{ from_city }} → {{ to_city }}</h1>

<h3>Best Layovers</h3>

{% for item in results %}

<div>

    <h4>{{ item.name }}</h4>

    <p>
        Final Score:
        {{ item.final_score }}
    </p>

    <p>
        City Time:
        {{ item.city_time }} mins
    </p>

    <p>
        {{ item.note }}
    </p>

</div>

<hr>

{% endfor %}
