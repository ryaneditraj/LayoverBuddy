<!DOCTYPE html>
<html>

<head>

    <title>LayoverBuddy</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 30px;
        }

        .box {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        .footer {
            margin-top: 25px;
        }

        .footer a {
            margin-right: 15px;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>LayoverBuddy</h1>

        <p>
            Find better layovers,
            not just cheaper flights.
        </p>

        <form action="/search">

            <label>
                From City
            </label>

            <input
                type="text"
                name="from_city"
                placeholder="Chennai"
            >

            <label>
                To City
            </label>

            <input
                type="text"
                name="to_city"
                placeholder="New York"
            >

            <button type="submit">
                Find Layovers
            </button>

        </form>

        <div class="footer">

            <a href="/about">
                About
            </a>

            <a href="/stats">
                Statistics
            </a>

      </div>

    </div>

</body>

</html>
